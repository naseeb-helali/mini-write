global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: mini-write
    environment: staging

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:

  alertmanagers:

    - static_configs:

        - targets:
            - alertmanager:9093

scrape_configs:

  # ==========================================================
  # Prometheus Self Monitoring
  # ==========================================================
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  # ==========================================================
  # API Service Metrics
  # ==========================================================
  - job_name: api

    scrape_interval: 15s
    metrics_path: /metrics

    static_configs:
      - targets:
          - api:80
        labels:
          service: api
          layer: application

  # ==========================================================
  # Worker Metrics
  # ==========================================================
  - job_name: worker

    scrape_interval: 15s
    metrics_path: /metrics

    static_configs:
      - targets:
          - worker:9464
        labels:
          service: worker
          layer: application

  # ==========================================================
  # Redis Exporter
  # ==========================================================
  - job_name: redis

    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
          layer: infrastructure

  # ==========================================================
  # PostgreSQL Exporter
  # ==========================================================
  - job_name: postgres

    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
          layer: infrastructure

  # ==========================================================
  # Node Exporter
  # ==========================================================
  - job_name: node

    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: host
          layer: runtime

  # ==========================================================
  # cAdvisor
  # ==========================================================
  - job_name: cadvisor

    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: containers
          layer: runtime

  # ==========================================================
  # Loki
  # ==========================================================
  - job_name: loki

    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki
          layer: observability

  # ==========================================================
  # Alertmanager
  # ==========================================================
  - job_name: alertmanager

    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: alertmanager
          layer: observability