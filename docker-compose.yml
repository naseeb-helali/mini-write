version: '3.8'

# =====================================================================
# NETWORKS: Network isolation for security (Layer 4 Isolation)
# =====================================================================
networks:
  frontend-network: # External network for Proxy and API only
    driver: bridge  # In Production Use overlay Instead of bridge or Kubernetes (CNI Plugins) For example (Calico or Flannel) which solve the problem of communication between servers (nodes) automatically and professionally.
  backend-network:  # A completely isolated internal network for rules and Redis
    driver: bridge  # In Production Use overlay Instead of bridge or Kubernetes (CNI Plugins) For example (Calico or Flannel) which solve the problem of communication between servers (nodes) automatically and professionally.
    #internal: true # This feature to prevent any internet disconnection from this network.

# =====================================================================
# VOLUMES: Data persistence
# =====================================================================
volumes:
  postgres_data:
    name: miniwrite_postgres_data
  redis_data:
    name: miniwrite_redis_data
  minio_data:
    name: miniwrite_minio_data

# =====================================================================
# SERVICES: Container dissection
# =====================================================================
services:

  # 1. Gateway (Nginx) - The only gateway to the outside world
  gateway:
    image: nginx:1.25-alpine
    container_name: mw-gateway
    restart: always
    #read_only: true # (Security Hardening) This container musn't write on itself.
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-network
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.2"

  # 2. Core API - Main Engine (Multi-stage Build)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mw-api
    restart: on-failure
    env_file: .env
    environment:
      - NODE_ENV=production
    networks:
      - frontend-network
      - backend-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: "0.5"

  # 3. Background Worker - Heavy Task Processor
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mw-worker
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - backend-network
    # Add a log limit to prevent the disk from filling up with logs.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1024m
    cpus: "1.0"


  # 4. Database (PostgreSQL) - State Store
  database:
    image: postgres:15-alpine
    container_name: mw-postgres
    shm_size: 128mb # Improving shared memory performance
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "0.5"

  # 5. Cache & Queue (Redis)
  redis:
    image: redis:7-alpine
    container_name: mw-redis
    command: redis-server --appendonly yes # Ensuring that tasks are not lost upon restart 
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    cpus: "0.3"

  # 6. Object Storage (MinIO) - S3 emulator
  storage:
    image: minio/minio
    container_name: mw-storage
    ports:
      - "19000:9000" # API (Internal 9000 -> External 19000)
      - "19001:9001" # Console (Internal 9001 -> External 19001)
    env_file: .env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 512m
    cpus: "0.5"
