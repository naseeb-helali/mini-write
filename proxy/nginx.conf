# Global settings for performance
user  nginx;
worker_processes  auto; # Automatically adjust to CPU cores
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024; # Handle 1024 simultaneous connections per worker
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Optimization: Performance and Security headers
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M; # Essential for the Storage (Upload) service later

    # Hide Nginx version for security (Don't help hackers)
    server_tokens off;

    # Define the Upstream (The API Service Name in Docker)
    upstream api_server {
        server api:80;
    }

    server {
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'self'";
        
        listen 80;
        server_name localhost;

        # 1. API Reverse Proxy
        location /api/v1/ {

            if ($request_method !~ ^(GET|POST|PUT|DELETE)$ ) {
                return 405;
            }

            proxy_hide_header X-Powered-By;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_server;

            # Standard Proxy Headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Health Check (Directly from Nginx)
        location /health {
            return 200 'Nginx Gateway is Healthy';
            add_header Content-Type text/plain;
        }

        # 3. Custom Error Pages (User Experience)
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
