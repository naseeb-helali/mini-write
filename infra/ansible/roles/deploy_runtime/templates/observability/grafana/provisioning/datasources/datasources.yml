apiVersion: 1

deleteDatasources:

  - name: Prometheus
    orgId: 1

  - name: Loki
    orgId: 1

datasources:

  # ==========================================================
  # Prometheus
  # ==========================================================
  - name: Prometheus

    uid: prometheus

    type: prometheus

    access: proxy

    url: http://prometheus:9090

    isDefault: true

    editable: false

    jsonData:

      httpMethod: POST

      manageAlerts: true

      prometheusType: Prometheus

      cacheLevel: High

      incrementalQuerying: true

      incrementalQueryOverlapWindow: 10m

  # ==========================================================
  # Loki
  # ==========================================================
  - name: Loki

    uid: loki

    type: loki

    access: proxy

    url: http://loki:3100

    editable: false

    jsonData:

      maxLines: 5000

      derivedFields:

        - name: correlation_id

          matcherRegex: '"correlation_id":"([^"]+)"'

          url: ""

          datasourceUid: ""