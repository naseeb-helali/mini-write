---
deploy_root: /opt/deploy

deploy_directories:
  - compose
  - scripts
  - state
  - logs
  - env
  - proxy

deployment_state_file: "{{ deploy_root }}/state/deployment_state.json"

deployment_log_file: "{{ deploy_root }}/logs/deploy.log"

deploy_scripts:
  - deploy.sh
  - rollback.sh

runtime_subdirectory: runtime

deploy_runtime_modules:
  - preflight.sh
  - executor.sh
  - verifier.sh
  - recovery.sh
  - state.sh
  - telemetry.sh
  - cleanup.sh
  - metrics.sh

deploy_runtime_directories:
  - compose
  - scripts
  - state
  - logs
  - env
  - proxy

immutable_runtime_dirs:
  - compose
  - scripts
  - proxy

mutable_runtime_dirs:
  - state
  - logs
  - env
