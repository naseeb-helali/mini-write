---
- name: Create deployment root directory
  ansible.builtin.file:
    path: "{{ deploy_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create deployment subdirectories
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ deploy_directories }}"

- name: Deploy docker compose file
  ansible.builtin.template:
    src: docker-compose.staging.yml.j2
    dest: "{{ deploy_root }}/compose/docker-compose.staging.yml"
    owner: root
    group: root
    mode: '0644'

- name: Deploy nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ deploy_root }}/proxy/nginx.conf"
    owner: root
    group: root
    mode: '0644'

- name: Deploy deployment scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ deploy_root }}/scripts/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ deploy_scripts }}"

- name: Check deployment state file
  ansible.builtin.stat:
    path: "{{ deployment_state_file }}"
  register: deployment_state

- name: Bootstrap deployment state file
  ansible.builtin.template:
    src: deployment_state.json.j2
    dest: "{{ deployment_state_file }}"
    owner: root
    group: root
    mode: '0644'
  when: not deployment_state.stat.exists

- name: Check staging env file
  ansible.builtin.stat:
    path: "{{ deploy_root }}/env/.env.staging"
  register: env_file

- name: Bootstrap staging env file
  ansible.builtin.template:
    src: env.staging.j2
    dest: "{{ deploy_root }}/env/.env.staging"
    owner: root
    group: root
    mode: '0640'
  when: not env_file.stat.exists

- name: Set ownership for immutable runtime directories
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ item }}"
    owner: root
    group: root
    mode: '0755'
    state: directory
  loop: "{{ immutable_runtime_dirs }}"

- name: Set ownership for mutable runtime directories
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0755'
    state: directory
  loop: "{{ mutable_runtime_dirs }}"

- name: Set deployment state permissions
  ansible.builtin.file:
    path: "{{ deploy_root }}/state/deployment_state.json"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'

- name: Set staging env permissions
  ansible.builtin.file:
    path: "{{ deploy_root }}/env/.env.staging"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0640'

- name: Check deploy log file
  ansible.builtin.stat:
    path: "{{ deploy_root }}/logs/deploy.log"
  register: deploy_log

- name: Bootstrap deploy log file
  ansible.builtin.file:
    path: "{{ deploy_root }}/logs/deploy.log"
    state: touch
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'
  when: not deploy_log.stat.exists

