---
- name: Create deployment root directory
  ansible.builtin.file:
    path: "{{ deploy_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create deployment subdirectories
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ deploy_directories }}"

- name: Create deployment metrics directory
  ansible.builtin.file:
    path: "{{ deploy_root }}/metrics"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Create runtime modules directory
  ansible.builtin.file:
    path: "{{ deploy_root }}/scripts/{{ runtime_subdirectory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy docker compose file
  ansible.builtin.template:
    src: docker-compose.staging.yml.j2
    dest: "{{ deploy_root }}/compose/docker-compose.staging.yml"
    owner: root
    group: root
    mode: '0644'

- name: Deploy nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ deploy_root }}/proxy/nginx.conf"
    owner: root
    group: root
    mode: '0644'

- name: Deploy deployment scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ deploy_root }}/scripts/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ deploy_scripts }}"

- name: Deploy runtime modules
  ansible.builtin.template:
    src: "runtime/{{ item }}.j2"
    dest: "{{ deploy_root }}/scripts/{{ runtime_subdirectory }}/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ deploy_runtime_modules }}"

- name: Check deployment state file
  ansible.builtin.stat:
    path: "{{ deployment_state_file }}"
  register: deployment_state

- name: Bootstrap deployment state file
  ansible.builtin.template:
    src: deployment_state.json.j2
    dest: "{{ deployment_state_file }}"
    owner: root
    group: root
    mode: '0644'
  when: not deployment_state.stat.exists

- name: Check staging env file
  ansible.builtin.stat:
    path: "{{ deploy_root }}/env/.env.staging"
  register: env_file

- name: Bootstrap staging env file
  ansible.builtin.template:
    src: env.staging.j2
    dest: "{{ deploy_root }}/env/.env.staging"
    owner: root
    group: root
    mode: '0640'
  when: not env_file.stat.exists

- name: Set ownership for immutable runtime directories
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ item }}"
    owner: root
    group: root
    mode: '0755'
    state: directory
  loop: "{{ immutable_runtime_dirs }}"

- name: Set ownership for mutable runtime directories
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0755'
    state: directory
  loop: "{{ mutable_runtime_dirs }}"

- name: Set deployment state permissions
  ansible.builtin.file:
    path: "{{ deploy_root }}/state/deployment_state.json"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'

- name: Set staging env permissions
  ansible.builtin.file:
    path: "{{ deploy_root }}/env/.env.staging"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0640'

- name: Check deploy log file
  ansible.builtin.stat:
    path: "{{ deploy_root }}/logs/deploy.log"
  register: deploy_log

- name: Bootstrap deploy log file
  ansible.builtin.file:
    path: "{{ deploy_root }}/logs/deploy.log"
    state: touch
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'
  when: not deploy_log.stat.exists

# ==========================================
# Observability Platform Deployment Tasks
# ==========================================

- name: Create observability subdirectories inside compose directory
  ansible.builtin.file:
    path: "{{ deploy_root }}/compose/observability/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - alertmanager
    - exporters/cadvisor
    - exporters/node-exporter
    - exporters/postgres-exporter
    - exporters/redis-exporter
    - grafana/dashboards/application
    - grafana/dashboards/deployment
    - grafana/dashboards/incidents
    - grafana/dashboards/queue
    - grafana/dashboards/system
    - grafana/provisioning/alerting
    - grafana/provisioning/dashboards
    - grafana/provisioning/datasources
    - loki
    - prometheus/rules
    - prometheus/targets
    - promtail

- name: Deploy observability configuration files and templates
  ansible.builtin.template:
    src: "observability/{{ item }}.j2"
    dest: "{{ deploy_root }}/compose/observability/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - alertmanager/alertmanager.yml
    - grafana/provisioning/alerting/contact-points.yml
    - grafana/provisioning/dashboards/dashbords.yml
    - grafana/provisioning/datasources/datasources.yml
    - loki/config.yml
    - prometheus/prometheus.yml
    - promtail/config.yml
  ignore_errors: true

- name: Copy static observability configuration files (non-template)
  ansible.builtin.copy:
    src: "observability/{{ item }}"
    dest: "{{ deploy_root }}/compose/observability/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - README.md
    - grafana/dashboards/application/application-health.json
    - grafana/dashboards/deployment/deployment-operations.json
    - grafana/dashboards/queue/queue-operations.json
    - grafana/dashboards/system/system-overview.json
    - prometheus/rules/01-infrastructure.yml
    - prometheus/rules/02-api.yml
    - prometheus/rules/03-worker.yml