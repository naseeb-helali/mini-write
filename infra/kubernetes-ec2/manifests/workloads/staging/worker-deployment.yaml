apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mini-write-staging
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: mini-write
    app.kubernetes.io/component: background-processing
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: mini-write
        app.kubernetes.io/component: background-processing
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: 496494570164.dkr.ecr.us-east-1.amazonaws.com/mini-write-worker@sha256:59f1c216a411e4713b367fd83c40a444b7d7b5d1f301960d4e8f7cea83187d64
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mini-write-staging-runtime
          env:
            - name: WORKER_CONCURRENCY
              value: "2"
            - name: WORKER_RETRY_LIMIT
              value: "3"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-write-staging-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-write-staging-secrets
                  key: REDIS_PASSWORD
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Initial scheduling estimates; tune after observing real workload usage.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
