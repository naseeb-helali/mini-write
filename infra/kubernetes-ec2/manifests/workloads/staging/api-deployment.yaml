apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mini-write-staging
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mini-write
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # API initUserTable() concurrency safety is not established. Recreate prevents
  # old/new API Pods from running that initialization concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: mini-write
        app.kubernetes.io/component: application
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 496494570164.dkr.ecr.us-east-1.amazonaws.com/mini-write-api@sha256:bd57bd8b9b6504c3447aca3850edd0f4a2d4ad27494cdd9ec7eb73f3a86c287d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mini-write-staging-runtime
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-write-staging-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-write-staging-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mini-write-staging-secrets
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Initial scheduling estimates; tune after observing real workload usage.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
