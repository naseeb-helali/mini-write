---
- name: Install operating system prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
      - apt-transport-https
      - socat
      - conntrack
      - ipset
      - chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable active swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Ensure kernel modules are configured for boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  notify: Apply sysctl settings

- name: Ensure chrony is enabled and active
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Apply pending handlers before continuing
  ansible.builtin.meta: flush_handlers
