name: Mini-Write CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  IMAGE_NAME: mini-write

permissions:
  contents: read
  packages: write

jobs:

# ==========================================
# 0) VALIDATE
# ==========================================
  validate-runner:
    runs-on:
      - self-hosted
      - linux
      - x64
      - staging
      - mini-write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner context
        run: |
          echo "Runner validation started"
          whoami
          hostname
          pwd

      - name: Validate Docker access
        run: |
          docker --version
          docker compose version
          docker ps

      - name: Validate complete deploy runtime structure (IaC Artifacts)
        run: |
          echo "=== 1. Checking Deploy Root & Main Directories ==="
          ls -la /opt/deploy
          test -d /opt/deploy/compose
          test -d /opt/deploy/scripts
          test -d /opt/deploy/state
          test -d /opt/deploy/logs
          test -d /opt/deploy/env
          test -d /opt/deploy/proxy

          echo "=== 2. Checking Docker Compose & Nginx Proxy Config ==="
          ls -la /opt/deploy/compose/docker-compose.staging.yml
          ls -la /opt/deploy/proxy/nginx.conf

          echo "=== 3. Checking Core Deployment Scripts ==="
          ls -la /opt/deploy/scripts/deploy.sh
          ls -la /opt/deploy/scripts/rollback.sh
          [ -x /opt/deploy/scripts/deploy.sh ]
          [ -x /opt/deploy/scripts/rollback.sh ]

          echo "=== 4. Checking Runtime Modules ==="
          ls -la /opt/deploy/scripts/runtime/
          for mod in preflight.sh executor.sh verifier.sh recovery.sh state.sh telemetry.sh cleanup.sh metrics.sh; do
            ls -la "/opt/deploy/scripts/runtime/$mod"
            [ -x "/opt/deploy/scripts/runtime/$mod" ]
          done

          echo "=== 5. Checking Complete Observability Structure ==="
          ls -la /opt/deploy/compose/observability
          
          # Alertmanager
          ls -la /opt/deploy/compose/observability/alertmanager/alertmanager.yml

          # Exporters
          test -d /opt/deploy/compose/observability/exporters/cadvisor
          test -d /opt/deploy/compose/observability/exporters/node-exporter
          test -d /opt/deploy/compose/observability/exporters/postgres-exporter
          test -d /opt/deploy/compose/observability/exporters/redis-exporter

          # Grafana Dashboards & Provisioning
          ls -la /opt/deploy/compose/observability/grafana/dashboards/application/application-health.json
          ls -la /opt/deploy/compose/observability/grafana/dashboards/deployment/deployment-operations.json
          ls -la /opt/deploy/compose/observability/grafana/dashboards/queue/queue-operations.json
          ls -la /opt/deploy/compose/observability/grafana/dashboards/system/system-overview.json
          ls -la /opt/deploy/compose/observability/grafana/provisioning/alerting/contact-points.yml
          ls -la /opt/deploy/compose/observability/grafana/provisioning/dashboards/dashbords.yml
          ls -la /opt/deploy/compose/observability/grafana/provisioning/datasources/datasources.yml

          # Loki & Promtail configs
          ls -la /opt/deploy/compose/observability/loki/config.yml
          ls -la /opt/deploy/compose/observability/promtail/config.yml

          # Prometheus config & rules
          ls -la /opt/deploy/compose/observability/prometheus/prometheus.yml
          ls -la /opt/deploy/compose/observability/prometheus/rules/01-infrastructure.yml
          ls -la /opt/deploy/compose/observability/prometheus/rules/02-api.yml
          ls -la /opt/deploy/compose/observability/prometheus/rules/03-worker.yml

          echo "=== 6. Checking State and Environment Files ==="
          ls -la /opt/deploy/state/deployment_state.json
          ls -la /opt/deploy/env/.env.staging

      - name: Validate write access
        run: |
          echo "runner validation $(date)" >> /opt/deploy/logs/deploy.log
          tail -n 5 /opt/deploy/logs/deploy.log

      - name: Success confirmation
        run: |
          echo "Complete runner and IaC validation completed successfully"


# ==========================================
# 1) QUALITY
# ==========================================
  quality:

    needs: validate-runner
    runs-on:
      - self-hosted
      - linux
      - x64
      - staging
      - mini-write

    strategy:
      matrix:
        service: [api, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: cd ${{ matrix.service }} && npm ci

      - run: cd ${{ matrix.service }} && npm run lint

      - name: Test + Coverage Gate (NO jq/bc)
        run: |
          cd ${{ matrix.service }}
          npm test -- --coverage
          node -e "
          const c=require('./coverage/coverage-summary.json');
          const pct=c.total.lines.pct;
          console.log('Coverage:', pct);
          if(pct<70) process.exit(1);
          "

# ==========================================
# 2) SECURITY
# ==========================================
  security:
    needs: quality

    runs-on:
      - self-hosted
      - linux
      - x64
      - staging
      - mini-write

    strategy:
      matrix:
        service: [api, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: cd ${{ matrix.service }} && npm audit --audit-level=critical

# ==========================================
# 3) BUILD
# ==========================================
  build:
    needs: [quality, security]

    runs-on:
      - self-hosted
      - linux
      - x64
      - staging
      - mini-write

    strategy:
      matrix:
        service: [api, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}

# ==========================================
# 4) DEPLOY STAGING (SAFE)
# ==========================================
  deploy-staging:
    timeout-minutes: 20
    concurrency:
      group: staging-deploy
      cancel-in-progress: true
    needs: build

    runs-on:
      - self-hosted
      - linux
      - x64
      - staging
      - mini-write

    environment: staging

    env:
      DEPLOY_MODE: local # ← غيّرها إلى ssh عند الحاجة

    steps:

      # =========================
      # 1) Generate env
      # =========================
      - name: Generate env file
        run: |
          cat <<EOF > .env.staging
          NODE_ENV=production
          HTTP_PORT=80

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ENDPOINT=storage
          MINIO_PORT=9000

          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=1h

          WORKER_RETRY_LIMIT=3
          WORKER_CONCURRENCY=2
          QUEUE_NAME=document_processing

          RUNTIME_VALIDATION_ENABLED=true
          EOF

      # =========================
      # 2) Login to GHCR
      # =========================
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # =========================
      # 3) LOCAL DEPLOY
      # =========================
      - name: Deploy (LOCAL)
        if: env.DEPLOY_MODE == 'local'
        run: |
          cp .env.staging /opt/deploy/env/.env.staging

          /opt/deploy/scripts/deploy.sh \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }} \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}

      # =========================
      # 4) SSH DEPLOY
      # =========================
      - name: Copy env via SSH
        if: env.DEPLOY_MODE == 'ssh'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: ".env.staging"
          target: "/opt/deploy/env/"

      - name: Deploy via SSH
        if: env.DEPLOY_MODE == 'ssh'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            /opt/deploy/compose/deploy.sh \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}

      # =========================
      # 4) Safety Mask
      # =========================
      - name: Mask secrets
        run: echo "::add-mask::${{ secrets.JWT_SECRET }}"

# ==========================================
# 5) PRODUCTION
# ==========================================
