name: Mini-Write CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: mini-write
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: "70"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # ============================================================
  # 0) VALIDATE
  # ============================================================
  validate:
    name: Validate Execution Environment
    runs-on: [self-hosted, linux, x64, mini-write]

    env:
      JOB_KEY: "validate"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check timing files after checkout
        run: |
          echo "=== After checkout ==="
          ls -la .ci-timing || echo ".ci-timing does NOT exist"

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      - name: Validate runner
        run: |
          set -euo pipefail

          echo "=== Runner ==="
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Runner: ${RUNNER_NAME:-unknown}"

          echo "=== Required tools ==="
          git --version
          node --version
          npm --version
          docker --version

      - name: Validate Node.js version
        run: |
          set -euo pipefail

          node_major="$(node -p 'process.versions.node.split(".")[0]')"

          if [ "$node_major" -lt 20 ]; then
            echo "ERROR: Node.js 20 or newer is required."
            exit 1
          fi

      - name: Validate Docker access
        run: |
          set -euo pipefail

          docker version
          docker info

      - name: Validate repository structure
        run: |
          set -euo pipefail

          test -f api/package.json
          test -f api/package-lock.json

          test -f worker/package.json
          test -f worker/package-lock.json

          test -f api/Dockerfile
          test -f worker/Dockerfile

          echo "Repository structure validation passed."

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 1) QUALITY
  # ============================================================
  quality:
    name: Quality (${{ matrix.service }})
    needs: validate
    runs-on: [self-hosted, linux, x64, mini-write]

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    env:
      JOB_KEY: "quality-${{ matrix.service }}"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 2) SECURITY
  # ============================================================
  security:
    name: Security (${{ matrix.service }})
    needs: validate
    runs-on: [self-hosted, linux, x64, mini-write]

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    env:
      JOB_KEY: "security-${{ matrix.service }}"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Dependency security audit
        working-directory: ${{ matrix.service }}
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 3) TESTS
  # ============================================================
  tests:
    name: Tests (${{ matrix.service }})
    needs: validate
    runs-on: [self-hosted, linux, x64, mini-write]

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    env:
      JOB_KEY: "tests-${{ matrix.service }}"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage

      - name: Enforce coverage gate
        working-directory: ${{ matrix.service }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const file = "./coverage/coverage-summary.json";

          if (!fs.existsSync(file)) {
            console.error(`Coverage summary not found: ${file}`);
            process.exit(1);
          }

          const coverage = require(file);

          const threshold = Number(process.env.COVERAGE_THRESHOLD);
          const actual = Number(coverage.total.lines.pct);

          console.log(`Coverage: ${actual}%`);
          console.log(`Required: ${threshold}%`);

          if (!Number.isFinite(actual)) {
            console.error("Coverage value is invalid.");
            process.exit(1);
          }

          if (actual < threshold) {
            console.error(
              `Coverage gate failed: ${actual}% < ${threshold}%`
            );
            process.exit(1);
          }

          console.log("Coverage gate passed.");
          NODE

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 4) BUILD + SECURITY SCAN + PUBLISH
  # ============================================================
  build:
    name: Build Artifacts
    needs: [quality, security, tests]
    runs-on: [self-hosted, linux, x64, mini-write]

    environment:
      name: staging

    outputs:
      registry_type: ${{ steps.registry.outputs.registry_type }}
      registry_prefix: ${{ steps.registry.outputs.registry_prefix }}
      aws_account_id: ${{ steps.registry.outputs.aws_account_id }}
      aws_region: ${{ steps.registry.outputs.aws_region }}

      api_image: ${{ steps.registry.outputs.api_image }}
      worker_image: ${{ steps.registry.outputs.worker_image }}

      api_digest: ${{ steps.api_push.outputs.digest }}
      worker_digest: ${{ steps.worker_push.outputs.digest }}

    env:
      JOB_KEY: "build"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      # ----------------------------------------------------------
      # REGISTRY CONFIGURATION
      # ----------------------------------------------------------
      - name: Resolve registry configuration
        id: registry
        shell: bash
        env:
          REGISTRY_TYPE: ${{ vars.REGISTRY_TYPE }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          case "${REGISTRY_TYPE}" in
            ecr)
              test -n "${AWS_ACCOUNT_ID}" || {
                echo "::error::AWS_ACCOUNT_ID is required when REGISTRY_TYPE=ecr"
                exit 1
              }

              test -n "${AWS_REGION}" || {
                echo "::error::AWS_REGION is required when REGISTRY_TYPE=ecr"
                exit 1
              }

              REGISTRY_PREFIX="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
              ;;

            ghcr)
              REGISTRY_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
              ;;

            *)
              echo "::error::Unsupported REGISTRY_TYPE: '${REGISTRY_TYPE}'"
              echo "::error::Expected one of: ghcr, ecr"
              exit 1
              ;;
          esac

          API_IMAGE="${REGISTRY_PREFIX}/${IMAGE_NAME}-api:${GITHUB_SHA}"
          WORKER_IMAGE="${REGISTRY_PREFIX}/${IMAGE_NAME}-worker:${GITHUB_SHA}"

          echo "registry_type=${REGISTRY_TYPE}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${REGISTRY_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "aws_account_id=${AWS_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"

          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${WORKER_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "=== Registry Configuration ==="
          echo "Registry type : ${REGISTRY_TYPE}"
          echo "Registry      : ${REGISTRY_PREFIX}"
          echo "API image     : ${API_IMAGE}"
          echo "Worker image  : ${WORKER_IMAGE}"

      # ----------------------------------------------------------
      # AWS / GHCR AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        if: steps.registry.outputs.registry_type == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.registry.outputs.aws_account_id }}:role/mini-write-github-ci-runner
          aws-region: ${{ steps.registry.outputs.aws_region }}

      - name: Login to Amazon ECR
        if: steps.registry.outputs.registry_type == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: steps.registry.outputs.registry_type == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # DOCKER BUILD ENVIRONMENT
      # ----------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check registry connectivity
        shell: bash
        env:
          REGISTRY_TYPE: ${{ steps.registry.outputs.registry_type }}
          REGISTRY_PREFIX: ${{ steps.registry.outputs.registry_prefix }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          echo "=== Registry Connectivity ==="
          echo "Registry type: ${REGISTRY_TYPE}"
          echo "Registry: ${REGISTRY_PREFIX}"

          if [ "${REGISTRY_TYPE}" = "ecr" ]; then
            echo "Checking ECR authentication..."

            aws ecr get-login-password \
              --region "${AWS_REGION}" \
            | docker login \
                --username AWS \
                --password-stdin "${REGISTRY_PREFIX}"

            echo "ECR authentication successful."

          else
            echo "Checking GHCR connectivity..."

            curl -fsSI "https://ghcr.io" | head -n 1

            echo "GHCR connectivity check passed."
          fi

          echo "Registry connectivity check passed."

      - name: Prepare Trivy cache directory
        run: |
          set -euo pipefail

          mkdir -p .trivycache
          ls -ld .trivycache

      # ----------------------------------------------------------
      # API
      # ----------------------------------------------------------
      - name: Build API image (local)
        id: api_build_local
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: true

          tags: |
            ${{ steps.registry.outputs.api_image }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Verify API image before Trivy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.api_image }}
        run: |
          set -euo pipefail

          echo "IMAGE_REF=<${IMAGE_REF}>"

          docker image inspect "${IMAGE_REF}" >/dev/null

          docker image inspect "${IMAGE_REF}" \
            --format 'RepoTags={{json .RepoTags}}'

          docker image inspect "${IMAGE_REF}" \
            --format 'ImageID={{.Id}}'

          REVISION="$(
            docker image inspect "${IMAGE_REF}" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          echo "Revision: ${REVISION}"

          if [ "${REVISION}" != "${GITHUB_SHA}" ]; then
            echo "::error::OCI revision does not match GITHUB_SHA"
            echo "Expected: ${GITHUB_SHA}"
            echo "Actual:   ${REVISION}"
            exit 1
          fi

          echo "API image identity verified."

      - name: Scan API image (Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.api_image }}
          format: table

          # Intentionally preserved as informational for now.
          # We will make the CRITICAL vulnerability policy blocking
          # after the current CI is proven stable.
          exit-code: 0

          severity: CRITICAL
          ignore-unfixed: true
          cache-dir: .trivycache/
          version: v0.74.0

      - name: Push API image (main only)
        id: api_push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.api_image }}
        run: |
          set -euo pipefail

          echo "Pushing exact image that was built and scanned:"
          echo "${IMAGE_REF}"

          PUSH_LOG="$(mktemp)"

          if ! docker push "${IMAGE_REF}" 2>&1 | tee "${PUSH_LOG}"; then
            echo "::error::Failed to push API image."
            rm -f "${PUSH_LOG}"
            exit 1
          fi

          DIGEST="$(
            sed -n \
              's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' \
              "${PUSH_LOG}" |
            tail -n 1
          )"

          rm -f "${PUSH_LOG}"

          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to extract API image digest."
            exit 1
          fi

          echo "API published digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # WORKER
      # ----------------------------------------------------------
      - name: Build Worker image (local)
        id: worker_build_local
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: false
          load: true

          tags: |
            ${{ steps.registry.outputs.worker_image }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Verify Worker image before Trivy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.worker_image }}
        run: |
          set -euo pipefail

          echo "IMAGE_REF=<${IMAGE_REF}>"

          docker image inspect "${IMAGE_REF}" >/dev/null

          docker image inspect "${IMAGE_REF}" \
            --format 'RepoTags={{json .RepoTags}}'

          docker image inspect "${IMAGE_REF}" \
            --format 'ImageID={{.Id}}'

          REVISION="$(
            docker image inspect "${IMAGE_REF}" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          echo "Revision: ${REVISION}"

          if [ "${REVISION}" != "${GITHUB_SHA}" ]; then
            echo "::error::OCI revision does not match GITHUB_SHA"
            echo "Expected: ${GITHUB_SHA}"
            echo "Actual:   ${REVISION}"
            exit 1
          fi

          echo "Worker image identity verified."

      - name: Scan Worker image (Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.worker_image }}
          format: table

          # Intentionally preserved as informational for now.
          exit-code: 0

          severity: CRITICAL
          ignore-unfixed: true
          cache-dir: .trivycache/
          version: v0.74.0

          # Trivy was already installed by the API scan.
          skip-setup-trivy: true

          # The API scan already restored the Trivy DB cache.
          # Reuse the same local .trivycache directory instead
          # of restoring the GitHub Actions cache again.
          cache: false

      - name: Push Worker image (main only)
        id: worker_push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.worker_image }}
        run: |
          set -euo pipefail

          echo "Pushing exact image that was built and scanned:"
          echo "${IMAGE_REF}"

          PUSH_LOG="$(mktemp)"

          if ! docker push "${IMAGE_REF}" 2>&1 | tee "${PUSH_LOG}"; then
            echo "::error::Failed to push Worker image."
            rm -f "${PUSH_LOG}"
            exit 1
          fi

          DIGEST="$(
            sed -n \
              's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' \
              "${PUSH_LOG}" |
            tail -n 1
          )"

          rm -f "${PUSH_LOG}"

          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to extract Worker image digest."
            exit 1
          fi

          echo "Worker published digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # MAIN ONLY
      # ----------------------------------------------------------
      - name: Verify published image digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_DIGEST: ${{ steps.api_push.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "API digest: ${API_DIGEST}"
          echo "Worker digest: ${WORKER_DIGEST}"

          [[ "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${WORKER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "Published artifact digests are valid."


  # ============================================================
  # 5) ARTIFACT VERIFICATION
  # ============================================================
  artifact-verification:
    name: Verify Artifacts
    needs: build
    runs-on: [self-hosted, linux, x64, mini-write]

    env:
      JOB_KEY: "artifact-verification"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      # ----------------------------------------------------------
      # Always verify metadata passed from the build job
      # ----------------------------------------------------------
      - name: Verify build metadata
        env:
          REGISTRY_TYPE: ${{ needs.build.outputs.registry_type }}
          REGISTRY_PREFIX: ${{ needs.build.outputs.registry_prefix }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
        run: |
          set -euo pipefail

          test -n "${REGISTRY_TYPE}"
          test -n "${REGISTRY_PREFIX}"
          test -n "${API_IMAGE}"
          test -n "${WORKER_IMAGE}"

          echo "Registry type : ${REGISTRY_TYPE}"
          echo "Registry      : ${REGISTRY_PREFIX}"
          echo "API image     : ${API_IMAGE}"
          echo "Worker image  : ${WORKER_IMAGE}"

          case "${REGISTRY_TYPE}" in
            ecr|ghcr)
              ;;
            *)
              echo "::error::Invalid registry type: ${REGISTRY_TYPE}"
              exit 1
              ;;
          esac

      # ----------------------------------------------------------
      # Registry authentication is required only on main.
      # ----------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.registry_type == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.build.outputs.aws_account_id }}:role/mini-write-github-ci-runner
          aws-region: ${{ needs.build.outputs.aws_region }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.registry_type == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.registry_type == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # MAIN ONLY - verify registry artifacts
      # ----------------------------------------------------------
      - name: Verify published API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ needs.build.outputs.api_image }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.api_digest }}
        run: |
          set -euo pipefail

          test -n "${EXPECTED_DIGEST}"

          echo "API image: ${IMAGE_REF}"
          echo "Expected digest: ${EXPECTED_DIGEST}"

          INSPECT_OUTPUT="$(docker buildx imagetools inspect "${IMAGE_REF}")"

          echo "=== imagetools inspect ==="
          printf '%s\n' "${INSPECT_OUTPUT}"

          REMOTE_DIGEST="$(
            printf '%s\n' "${INSPECT_OUTPUT}" |
            sed -n 's/^Digest:[[:space:]]*//p' |
            head -n 1 |
            tr -d '\r'
          )"

          echo "=== Digest diagnostics ==="
          printf 'Expected: <%s>\n' "${EXPECTED_DIGEST}"
          printf 'Remote:   <%s>\n' "${REMOTE_DIGEST}"
          printf 'Expected length: %s\n' "${#EXPECTED_DIGEST}"
          printf 'Remote length:   %s\n' "${#REMOTE_DIGEST}"

          if [ "${REMOTE_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::Remote API digest does not match published digest."
            echo "Expected: ${EXPECTED_DIGEST}"
            echo "Remote:   ${REMOTE_DIGEST}"
            exit 1
          fi

          echo "API remote artifact verified."

      - name: Verify published Worker artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ needs.build.outputs.worker_image }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          set -euo pipefail

          test -n "${EXPECTED_DIGEST}"

          echo "Worker image: ${IMAGE_REF}"
          echo "Expected digest: ${EXPECTED_DIGEST}"

          REMOTE_DIGEST="$(
          docker buildx imagetools inspect "${IMAGE_REF}" |
          sed -n 's/^Digest:[[:space:]]*//p' |
          head -n 1 |
          tr -d '\r'
          )"

          if [ "${REMOTE_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::Remote Worker digest does not match published digest."
            echo "Expected: ${EXPECTED_DIGEST}"
            echo "Remote:   ${REMOTE_DIGEST}"
            exit 1
          fi

          echo "Worker remote artifact verified."

      # ----------------------------------------------------------
      # MAIN ONLY - verify build outputs
      # ----------------------------------------------------------
      - name: Verify build digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          set -euo pipefail

          [[ "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${WORKER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "API digest verified: ${API_DIGEST}"
          echo "Worker digest verified: ${WORKER_DIGEST}"

      # ----------------------------------------------------------
      # PULL REQUEST      
      # ----------------------------------------------------------
      - name: Verify pull request artifact metadata
        if: github.event_name == 'pull_request'
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
        run: |
          set -euo pipefail

          case "${API_IMAGE}" in
            *:${GITHUB_SHA})
              ;;
            *)
              echo "::error::API image tag does not match GITHUB_SHA."
              exit 1
              ;;
          esac

          case "${WORKER_IMAGE}" in
            *:${GITHUB_SHA})
              ;;
            *)
              echo "::error::Worker image tag does not match GITHUB_SHA."
              exit 1
              ;;
          esac

          echo "Pull request artifact metadata verified."
          echo "Actual image inspection was already performed in the build job."

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 6) PUBLISH ARTIFACT MANIFEST
  # ============================================================
  publish-manifest:
    name: Publish Artifact Manifest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build
      - artifact-verification

    runs-on: [self-hosted, linux, x64, mini-write]

    env:
      JOB_KEY: "publish-manifest"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start CI timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          date +%s > .ci-timing/started-epoch
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ci-timing/started-at

      - name: Generate artifact manifest
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
          REGISTRY_PREFIX: ${{ needs.build.outputs.registry_prefix }}
        run: |
          set -euo pipefail

          test -f ci/artifact-manifest.schema.json

          test -n "${API_DIGEST}"
          test -n "${WORKER_DIGEST}"
          test -n "${REGISTRY_PREFIX}"

          mkdir -p artifact

          cat > artifact/artifact-manifest.json <<EOF
          {
            "schemaVersion": "1.0",
            "project": "mini-write",
            "source": {
              "commit": "${GITHUB_SHA}"
            },
            "release": {
              "id": "${GITHUB_SHA}",
              "version": "sha-${GITHUB_SHA::12}"
            },
            "artifacts": {
              "api": {
                "name": "${REGISTRY_PREFIX}/${{ env.IMAGE_NAME }}-api",
                "tag": "${GITHUB_SHA}",
                "digest": "${API_DIGEST}"
              },
              "worker": {
                "name": "${REGISTRY_PREFIX}/${{ env.IMAGE_NAME }}-worker",
                "tag": "${GITHUB_SHA}",
                "digest": "${WORKER_DIGEST}"
              }
            }
          }
          EOF

          echo "Generated artifact manifest:"
          cat artifact/artifact-manifest.json

      - name: Validate artifact manifest
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const manifestPath = "artifact/artifact-manifest.json";
          const schemaPath = "ci/artifact-manifest.schema.json";

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, "utf8")
          );

          JSON.parse(fs.readFileSync(schemaPath, "utf8"));

          const shaPattern = /^[0-9a-f]{40}$/;
          const digestPattern = /^sha256:[0-9a-f]{64}$/;

          function fail(message) {
            console.error(
              `Manifest validation failed: ${message}`
            );
            process.exit(1);
          }

          if (manifest.schemaVersion !== "1.0") {
            fail("invalid schemaVersion");
          }

          if (manifest.project !== "mini-write") {
            fail("invalid project");
          }

          if (!shaPattern.test(manifest.source?.commit || "")) {
            fail("invalid source.commit");
          }

          if (manifest.release?.id !== manifest.source.commit) {
            fail("release.id must equal source.commit");
          }

          if (!manifest.release?.version) {
            fail("release.version is required");
          }

          for (const service of ["api", "worker"]) {
            const artifact = manifest.artifacts?.[service];

            if (!artifact) {
              fail(`missing artifact: ${service}`);
            }

            if (!artifact.name) {
              fail(`${service}.name is required`);
            }

            if (!shaPattern.test(artifact.tag || "")) {
              fail(
                `${service}.tag must be a 40-character SHA`
              );
            }

            if (!digestPattern.test(artifact.digest || "")) {
              fail(
                `${service}.digest must be a sha256 digest`
              );
            }

            if (artifact.tag !== manifest.source.commit) {
              fail(
                `${service}.tag does not match source commit`
              );
            }
          }

          if (manifest.source.commit !== process.env.GITHUB_SHA) {
            fail(
              "source.commit does not match GITHUB_SHA"
            );
          }

          if (
            manifest.artifacts.api.digest !==
            process.env.API_DIGEST
          ) {
            fail(
              "API digest does not match build output"
            );
          }

          if (
            manifest.artifacts.worker.digest !==
            process.env.WORKER_DIGEST
          ) {
            fail(
              "Worker digest does not match build output"
            );
          }

          console.log(
            "Artifact manifest validation passed."
          );

          console.log(
            JSON.stringify(manifest, null, 2)
          );
          NODE

      - name: Upload artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-artifact-${{ github.sha }}
          path: artifact/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Finalize CI timing
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test -f .ci-timing/started-epoch
          test -f .ci-timing/started-at

          completed_epoch="$(date +%s)"
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          started_epoch="$(cat .ci-timing/started-epoch)"
          started_at="$(cat .ci-timing/started-at)"
          duration_seconds="$((completed_epoch - started_epoch))"

          cat > ".ci-timing/${JOB_KEY}.json" <<EOF
          {
            "schemaVersion": "1.0",
            "job": "${JOB_KEY}",
            "status": "${{ job.status }}",
            "startedAt": "${started_at}",
            "completedAt": "${completed_at}",
            "durationSeconds": ${duration_seconds},
            "runAttempt": ${{ github.run_attempt }}
          }
          EOF

          jq empty ".ci-timing/${JOB_KEY}.json"
          cat ".ci-timing/${JOB_KEY}.json"

      - name: Upload CI timing fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ env.JOB_KEY }}
          path: .ci-timing/${{ env.JOB_KEY }}.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 7) CI TIMING AGGREGATION
  # ============================================================
  ci-timing:
    name: Aggregate CI Timing Evidence
    if: ${{ always() }}
    needs:
      - validate
      - quality
      - security
      - tests
      - build
      - artifact-verification
      - publish-manifest
    runs-on: [self-hosted, linux, x64, mini-write]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CI timing fragments
        uses: actions/download-artifact@v4
        with:
          pattern: mini-write-ci-timing-*
          path: ci-timing-input
          merge-multiple: false

      - name: Aggregate and validate CI timing evidence
        shell: bash
        env:
          WORKFLOW_STATUS: ${{ join(needs.*.result, ',') }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          test -d ci-timing-input

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = "ci-timing-input";
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith(".json")) files.push(full);
            }
          }

          walk(root);

          if (files.length === 0) {
            throw new Error("No CI timing fragments were downloaded.");
          }

          const fragments = files.map(file =>
            JSON.parse(fs.readFileSync(file, "utf8"))
          );

          const unique = new Map();

          for (const f of fragments) {
            if (f.schemaVersion !== "1.0" || !f.job || !f.status) {
              throw new Error(`Invalid timing fragment: ${f.job || "unknown"}`);
            }
            if (!Number.isInteger(f.durationSeconds) || f.durationSeconds < 0) {
              throw new Error(`Invalid duration: ${f.job}`);
            }
            if (unique.has(f.job)) {
              throw new Error(`Duplicate timing fragment: ${f.job}`);
            }
            unique.set(f.job, f);
          }

          const ordered = [...unique.values()].sort((a, b) =>
            a.startedAt.localeCompare(b.startedAt)
          );

          const earliest = ordered.reduce((a, b) =>
            a.startedAt < b.startedAt ? a : b
          );

          const latest = ordered.reduce((a, b) =>
            a.completedAt > b.completedAt ? a : b
          );

          const start = new Date(earliest.startedAt).getTime();
          const end = new Date(latest.completedAt).getTime();

          if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) {
            throw new Error("Invalid E2E timing boundaries.");
          }

          const workflowStatus =
            process.env.WORKFLOW_STATUS
              .split(",")
              .some(s => ["failure", "cancelled"].includes(s))
              ? "failed"
              : "passed";

          const jobs = {};

          for (const f of ordered) {
            const parts = f.job.split("-");
            const value = {
              startedAt: f.startedAt,
              completedAt: f.completedAt,
              durationSeconds: f.durationSeconds,
              status: f.status
            };

            if (["quality", "security", "tests"].includes(parts[0]) && parts[1]) {
              jobs[parts[0]] ??= {};
              jobs[parts[0]][parts.slice(1).join("-")] = value;
            } else {
              jobs[f.job.replaceAll("-", "_")] = value;
            }
          }

          const evidence = {
            schemaVersion: "1.0",
            project: "mini-write",
            pipeline: "ci",
            status: workflowStatus,
            run: {
              id: String(process.env.RUN_ID),
              attempt: Number(process.env.RUN_ATTEMPT),
              commit: process.env.COMMIT_SHA,
              event: process.env.EVENT_NAME,
              ref: process.env.GIT_REF
            },
            endToEnd: {
              definition: "first-job-start-to-last-job-end",
              startedAt: earliest.startedAt,
              completedAt: latest.completedAt,
              durationSeconds: Math.floor((end - start) / 1000),
              terminalJob: latest.job
            },
            jobs,
            evidence: {
              fragmentCount: ordered.length,
              source: "github-actions-job-timing-fragments"
            },
            timestamp: new Date().toISOString()
          };

          // ------- تحقق يدوي مطابق للـ schema -------
          const requiredTop = [
            "schemaVersion", "project", "pipeline", "status",
            "run", "endToEnd", "jobs", "evidence", "timestamp"
          ];
          for (const k of requiredTop) {
            if (!(k in evidence)) throw new Error(`Missing top-level field: ${k}`);
          }

          const requiredRun = ["id", "attempt", "commit", "event", "ref"];
          for (const k of requiredRun) {
            if (!(k in evidence.run)) throw new Error(`Missing run.${k}`);
          }

          const requiredE2E = [
            "definition", "startedAt", "completedAt",
            "durationSeconds", "terminalJob"
          ];
          for (const k of requiredE2E) {
            if (!(k in evidence.endToEnd)) throw new Error(`Missing endToEnd.${k}`);
          }

          const requiredEvidence = ["fragmentCount", "source"];
          for (const k of requiredEvidence) {
            if (!(k in evidence.evidence)) throw new Error(`Missing evidence.${k}`);
          }

          if (evidence.evidence.source !== "github-actions-job-timing-fragments") {
            throw new Error("Invalid evidence.source");
          }

          if (!/^[0-9a-f]{40}$/.test(evidence.run.commit)) {
            throw new Error("Invalid run.commit");
          }

          if (
            !Number.isInteger(evidence.run.attempt) ||
            evidence.run.attempt < 1
          ) {
            throw new Error("Invalid run.attempt");
          }

          if (!["passed", "failed"].includes(evidence.status)) {
            throw new Error("Invalid status");
          }

          if (typeof evidence.endToEnd.terminalJob !== "string" || !evidence.endToEnd.terminalJob) {
            throw new Error("Invalid endToEnd.terminalJob");
          }

          if (
            !Number.isInteger(evidence.endToEnd.durationSeconds) ||
            evidence.endToEnd.durationSeconds < 0
          ) {
            throw new Error("Invalid endToEnd.durationSeconds");
          }

          fs.mkdirSync("ci-timing-output", { recursive: true });
          fs.writeFileSync(
            "ci-timing-output/ci-timing.json",
            JSON.stringify(evidence, null, 2) + "\n"
          );

          console.log(JSON.stringify(evidence, null, 2));
          NODE

          node <<'NODE'
          const fs = require("fs");
          const schema = JSON.parse(
            fs.readFileSync("ci/ci-timing.schema.json", "utf8")
          );
          const evidence = JSON.parse(
            fs.readFileSync("ci-timing-output/ci-timing.json", "utf8")
          );

          if (schema.$schema !== "https://json-schema.org/draft/2020-12/schema") {
            throw new Error("Unexpected schema draft");
          }

          if (evidence.schemaVersion !== schema.properties.schemaVersion.const) {
            throw new Error("Schema version mismatch");
          }

          if (evidence.project !== "mini-write" || evidence.pipeline !== "ci") {
            throw new Error("Invalid evidence identity");
          }

          if (!["passed", "failed"].includes(evidence.status)) {
            throw new Error("Invalid status");
          }

          const requiredTop = [
            "schemaVersion", "project", "pipeline", "status",
            "run", "endToEnd", "jobs", "evidence", "timestamp"
          ];

          for (const k of requiredTop) {
            if (!(k in evidence)) {
              throw new Error(`Schema contract missing: ${k}`);
            }
          }

          if (
            !Number.isInteger(evidence.endToEnd.durationSeconds) ||
            evidence.endToEnd.durationSeconds < 0
          ) {
            throw new Error("Invalid E2E duration");
          }

          if (
            !Number.isInteger(evidence.evidence.fragmentCount) ||
            evidence.evidence.fragmentCount < 1
          ) {
            throw new Error("Invalid evidence.fragmentCount");
          }

          console.log("CI timing evidence contract validation passed.");
          NODE

      - name: Upload CI timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-ci-timing-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-timing-output/ci-timing.json
          if-no-files-found: error
          retention-days: 30