name: Mini-Write CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: mini-write
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: "70"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ============================================================
  # 0) VALIDATE
  # ============================================================
  validate:
    name: Validate Execution Environment
    runs-on: [self-hosted, linux, x64, mini-write]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate runner
        run: |
          set -euo pipefail

          echo "=== Runner ==="
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Runner: ${RUNNER_NAME:-unknown}"

          echo "=== Required tools ==="
          git --version
          node --version
          npm --version
          docker --version

      - name: Validate Node.js version
        run: |
          set -euo pipefail

          node_major="$(node -p 'process.versions.node.split(".")[0]')"

          if [ "$node_major" -lt 20 ]; then
            echo "ERROR: Node.js 20 or newer is required."
            exit 1
          fi

      - name: Validate Docker access
        run: |
          set -euo pipefail

          docker version
          docker info

      - name: Validate repository structure
        run: |
          set -euo pipefail

          test -f api/package.json
          test -f api/package-lock.json

          test -f worker/package.json
          test -f worker/package-lock.json

          test -f api/Dockerfile
          test -f worker/Dockerfile

          echo "Repository structure validation passed."

  # ============================================================
  # 1) QUALITY
  # ============================================================
  quality:
    name: Quality (${{ matrix.service }})
    needs: validate
    runs-on: [self-hosted, linux, x64, mini-write]

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

  # ============================================================
  # 2) SECURITY
  # ============================================================
  security:
    name: Security (${{ matrix.service }})
    needs: validate
    runs-on: [self-hosted, linux, x64, mini-write]

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Dependency security audit
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=critical

  # ============================================================
  # 3) TESTS
  # ============================================================
  tests:
    name: Tests (${{ matrix.service }})
    needs: validate
    runs-on: [self-hosted, linux, x64, mini-write]

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage

      - name: Enforce coverage gate
        working-directory: ${{ matrix.service }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const file = "./coverage/coverage-summary.json";

          if (!fs.existsSync(file)) {
            console.error(`Coverage summary not found: ${file}`);
            process.exit(1);
          }

          const coverage = require(file);

          const threshold = Number(process.env.COVERAGE_THRESHOLD);
          const actual = Number(coverage.total.lines.pct);

          console.log(`Coverage: ${actual}%`);
          console.log(`Required: ${threshold}%`);

          if (!Number.isFinite(actual)) {
            console.error("Coverage value is invalid.");
            process.exit(1);
          }

          if (actual < threshold) {
            console.error(
              `Coverage gate failed: ${actual}% < ${threshold}%`
            );
            process.exit(1);
          }

          console.log("Coverage gate passed.");
          NODE

  # ============================================================
  # 4) BUILD + SECURITY SCAN + PUBLISH
  # ============================================================
  build:
    name: Build Artifacts
    needs: [quality, security, tests]

    runs-on: [self-hosted, linux, x64, mini-write]

    environment:
      name: staging

    outputs:
      registry_type: ${{ steps.registry.outputs.registry_type }}
      registry_prefix: ${{ steps.registry.outputs.registry_prefix }}
      aws_account_id: ${{ steps.registry.outputs.aws_account_id }}
      aws_region: ${{ steps.registry.outputs.aws_region }}

      api_image: ${{ steps.registry.outputs.api_image }}
      worker_image: ${{ steps.registry.outputs.worker_image }}

      api_digest: ${{ steps.api_push.outputs.digest }}
      worker_digest: ${{ steps.worker_push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # REGISTRY CONFIGURATION
      # ----------------------------------------------------------
      - name: Resolve registry configuration
        id: registry
        shell: bash
        env:
          REGISTRY_TYPE: ${{ vars.REGISTRY_TYPE }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          case "${REGISTRY_TYPE}" in
            ecr)
              test -n "${AWS_ACCOUNT_ID}" || {
                echo "::error::AWS_ACCOUNT_ID is required when REGISTRY_TYPE=ecr"
                exit 1
              }

              test -n "${AWS_REGION}" || {
                echo "::error::AWS_REGION is required when REGISTRY_TYPE=ecr"
                exit 1
              }

              REGISTRY_PREFIX="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
              ;;

            ghcr)
              REGISTRY_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
              ;;

            *)
              echo "::error::Unsupported REGISTRY_TYPE: '${REGISTRY_TYPE}'"
              echo "::error::Expected one of: ghcr, ecr"
              exit 1
              ;;
          esac

          API_IMAGE="${REGISTRY_PREFIX}/${IMAGE_NAME}-api:${GITHUB_SHA}"
          WORKER_IMAGE="${REGISTRY_PREFIX}/${IMAGE_NAME}-worker:${GITHUB_SHA}"

          echo "registry_type=${REGISTRY_TYPE}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${REGISTRY_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "aws_account_id=${AWS_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"

          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${WORKER_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "=== Registry Configuration ==="
          echo "Registry type : ${REGISTRY_TYPE}"
          echo "Registry      : ${REGISTRY_PREFIX}"
          echo "API image     : ${API_IMAGE}"
          echo "Worker image  : ${WORKER_IMAGE}"

      # ----------------------------------------------------------
      # AWS / GHCR AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        if: steps.registry.outputs.registry_type == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.registry.outputs.aws_account_id }}:role/mini-write-github-ci-runner
          aws-region: ${{ steps.registry.outputs.aws_region }}

      - name: Login to Amazon ECR
        if: steps.registry.outputs.registry_type == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: steps.registry.outputs.registry_type == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # DOCKER BUILD ENVIRONMENT
      # ----------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check registry connectivity
        shell: bash
        env:
          REGISTRY_TYPE: ${{ steps.registry.outputs.registry_type }}
          REGISTRY_PREFIX: ${{ steps.registry.outputs.registry_prefix }}
        run: |
          set -euo pipefail

          echo "=== Registry Connectivity ==="
          echo "Registry type: ${REGISTRY_TYPE}"
          echo "Registry: ${REGISTRY_PREFIX}"

          if [ "${REGISTRY_TYPE}" = "ecr" ]; then
            curl -fsSI "https://${REGISTRY_PREFIX}" | head -n 1
          else
            curl -fsSI "https://ghcr.io" | head -n 1
          fi

          echo "Registry connectivity check passed."

      - name: Prepare Trivy cache directory
        run: |
          set -euo pipefail

          mkdir -p .trivycache
          ls -ld .trivycache

      # ----------------------------------------------------------
      # API
      # ----------------------------------------------------------
      - name: Build API image (local)
        id: api_build_local
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: true

          tags: |
            ${{ steps.registry.outputs.api_image }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Verify API image before Trivy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.api_image }}
        run: |
          set -euo pipefail

          echo "IMAGE_REF=<${IMAGE_REF}>"

          docker image inspect "${IMAGE_REF}" >/dev/null

          docker image inspect "${IMAGE_REF}" \
            --format 'RepoTags={{json .RepoTags}}'

          docker image inspect "${IMAGE_REF}" \
            --format 'ImageID={{.Id}}'

          REVISION="$(
            docker image inspect "${IMAGE_REF}" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          echo "Revision: ${REVISION}"

          if [ "${REVISION}" != "${GITHUB_SHA}" ]; then
            echo "::error::OCI revision does not match GITHUB_SHA"
            echo "Expected: ${GITHUB_SHA}"
            echo "Actual:   ${REVISION}"
            exit 1
          fi

          echo "API image identity verified."

      - name: Scan API image (Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.api_image }}
          format: table

          # Intentionally preserved as informational for now.
          # We will make the CRITICAL vulnerability policy blocking
          # after the current CI is proven stable.
          exit-code: 0

          severity: CRITICAL
          ignore-unfixed: true
          cache-dir: .trivycache/
          version: v0.74.0

      - name: Push API image (main only)
        id: api_push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.api_image }}
        run: |
          set -euo pipefail

          echo "Pushing exact image that was built and scanned:"
          echo "${IMAGE_REF}"

          PUSH_LOG="$(mktemp)"

          if ! docker push "${IMAGE_REF}" 2>&1 | tee "${PUSH_LOG}"; then
            echo "::error::Failed to push API image."
            rm -f "${PUSH_LOG}"
            exit 1
          fi

          DIGEST="$(
            sed -n \
              's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' \
              "${PUSH_LOG}" |
            tail -n 1
          )"

          rm -f "${PUSH_LOG}"

          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to extract API image digest."
            exit 1
          fi

          echo "API published digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # WORKER
      # ----------------------------------------------------------
      - name: Build Worker image (local)
        id: worker_build_local
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: false
          load: true

          tags: |
            ${{ steps.registry.outputs.worker_image }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Verify Worker image before Trivy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.worker_image }}
        run: |
          set -euo pipefail

          echo "IMAGE_REF=<${IMAGE_REF}>"

          docker image inspect "${IMAGE_REF}" >/dev/null

          docker image inspect "${IMAGE_REF}" \
            --format 'RepoTags={{json .RepoTags}}'

          docker image inspect "${IMAGE_REF}" \
            --format 'ImageID={{.Id}}'

          REVISION="$(
            docker image inspect "${IMAGE_REF}" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          echo "Revision: ${REVISION}"

          if [ "${REVISION}" != "${GITHUB_SHA}" ]; then
            echo "::error::OCI revision does not match GITHUB_SHA"
            echo "Expected: ${GITHUB_SHA}"
            echo "Actual:   ${REVISION}"
            exit 1
          fi

          echo "Worker image identity verified."

      - name: Scan Worker image (Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.worker_image }}
          format: table

          # Intentionally preserved as informational for now.
          exit-code: 0

          severity: CRITICAL
          ignore-unfixed: true
          cache-dir: .trivycache/
          version: v0.74.0

      - name: Push Worker image (main only)
        id: worker_push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.registry.outputs.worker_image }}
        run: |
          set -euo pipefail

          echo "Pushing exact image that was built and scanned:"
          echo "${IMAGE_REF}"

          PUSH_LOG="$(mktemp)"

          if ! docker push "${IMAGE_REF}" 2>&1 | tee "${PUSH_LOG}"; then
            echo "::error::Failed to push Worker image."
            rm -f "${PUSH_LOG}"
            exit 1
          fi

          DIGEST="$(
            sed -n \
              's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' \
              "${PUSH_LOG}" |
            tail -n 1
          )"

          rm -f "${PUSH_LOG}"

          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to extract Worker image digest."
            exit 1
          fi

          echo "Worker published digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # MAIN ONLY
      # ----------------------------------------------------------
      - name: Verify published image digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_DIGEST: ${{ steps.api_push.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "API digest: ${API_DIGEST}"
          echo "Worker digest: ${WORKER_DIGEST}"

          [[ "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${WORKER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "Published artifact digests are valid."

  # ============================================================
  # 5) ARTIFACT VERIFICATION
  # ============================================================
  artifact-verification:
    name: Verify Artifacts
    needs: build
    runs-on: [self-hosted, linux, x64, mini-write]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Always verify metadata passed from the build job
      # ----------------------------------------------------------
      - name: Verify build metadata
        env:
          REGISTRY_TYPE: ${{ needs.build.outputs.registry_type }}
          REGISTRY_PREFIX: ${{ needs.build.outputs.registry_prefix }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
        run: |
          set -euo pipefail

          test -n "${REGISTRY_TYPE}"
          test -n "${REGISTRY_PREFIX}"
          test -n "${API_IMAGE}"
          test -n "${WORKER_IMAGE}"

          echo "Registry type : ${REGISTRY_TYPE}"
          echo "Registry      : ${REGISTRY_PREFIX}"
          echo "API image     : ${API_IMAGE}"
          echo "Worker image  : ${WORKER_IMAGE}"

          case "${REGISTRY_TYPE}" in
            ecr|ghcr)
              ;;
            *)
              echo "::error::Invalid registry type: ${REGISTRY_TYPE}"
              exit 1
              ;;
          esac

      # ----------------------------------------------------------
      # Registry authentication is required only on main.
      #
      # Important:
      # We intentionally do NOT try to inspect local Docker images
      # from the build job on pull requests. Docker state is not a
      # reliable cross-job artifact.
      # ----------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.registry_type == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.build.outputs.aws_account_id }}:role/mini-write-github-ci-runner
          aws-region: ${{ needs.build.outputs.aws_region }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.registry_type == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.registry_type == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # MAIN ONLY - verify registry artifacts
      # ----------------------------------------------------------
      - name: Verify published API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ needs.build.outputs.api_image }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.api_digest }}
        run: |
          set -euo pipefail

          test -n "${EXPECTED_DIGEST}"

          echo "API image: ${IMAGE_REF}"
          echo "Expected digest: ${EXPECTED_DIGEST}"

          REMOTE_DIGEST="$(
            docker buildx imagetools inspect "${IMAGE_REF}" |
            sed -n 's/^Digest: //p' |
            head -n 1
          )"

          if [ "${REMOTE_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::Remote API digest does not match published digest."
            echo "Expected: ${EXPECTED_DIGEST}"
            echo "Remote:   ${REMOTE_DIGEST}"
            exit 1
          fi

          echo "API remote artifact verified."

      - name: Verify published Worker artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ needs.build.outputs.worker_image }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          set -euo pipefail

          test -n "${EXPECTED_DIGEST}"

          echo "Worker image: ${IMAGE_REF}"
          echo "Expected digest: ${EXPECTED_DIGEST}"

          REMOTE_DIGEST="$(
            docker buildx imagetools inspect "${IMAGE_REF}" |
            sed -n 's/^Digest: //p' |
            head -n 1
          )"

          if [ "${REMOTE_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::Remote Worker digest does not match published digest."
            echo "Expected: ${EXPECTED_DIGEST}"
            echo "Remote:   ${REMOTE_DIGEST}"
            exit 1
          fi

          echo "Worker remote artifact verified."

      # ----------------------------------------------------------
      # MAIN ONLY - verify build outputs
      # ----------------------------------------------------------
      - name: Verify build digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          set -euo pipefail

          [[ "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${WORKER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "API digest verified: ${API_DIGEST}"
          echo "Worker digest verified: ${WORKER_DIGEST}"

      # ----------------------------------------------------------
      # PULL REQUEST
      #
      # The images were already built and verified locally in the
      # build job. We do not falsely claim that the Docker images
      # still exist in this separate job.
      # ----------------------------------------------------------
      - name: Verify pull request artifact metadata
        if: github.event_name == 'pull_request'
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
        run: |
          set -euo pipefail

          case "${API_IMAGE}" in
            *:${GITHUB_SHA})
              ;;
            *)
              echo "::error::API image tag does not match GITHUB_SHA."
              exit 1
              ;;
          esac

          case "${WORKER_IMAGE}" in
            *:${GITHUB_SHA})
              ;;
            *)
              echo "::error::Worker image tag does not match GITHUB_SHA."
              exit 1
              ;;
          esac

          echo "Pull request artifact metadata verified."
          echo "Actual image inspection was already performed in the build job."

  # ============================================================
  # 6) PUBLISH ARTIFACT MANIFEST
  # ============================================================
  publish-manifest:
    name: Publish Artifact Manifest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build
      - artifact-verification

    runs-on: [self-hosted, linux, x64, mini-write]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate artifact manifest
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
          REGISTRY_PREFIX: ${{ needs.build.outputs.registry_prefix }}
        run: |
          set -euo pipefail

          test -f ci/artifact-manifest.schema.json

          test -n "${API_DIGEST}"
          test -n "${WORKER_DIGEST}"
          test -n "${REGISTRY_PREFIX}"

          mkdir -p artifact

          cat > artifact/artifact-manifest.json <<EOF
          {
            "schemaVersion": "1.0",
            "project": "mini-write",
            "source": {
              "commit": "${GITHUB_SHA}"
            },
            "release": {
              "id": "${GITHUB_SHA}",
              "version": "sha-${GITHUB_SHA::12}"
            },
            "artifacts": {
              "api": {
                "name": "${REGISTRY_PREFIX}/${{ env.IMAGE_NAME }}-api",
                "tag": "${GITHUB_SHA}",
                "digest": "${API_DIGEST}"
              },
              "worker": {
                "name": "${REGISTRY_PREFIX}/${{ env.IMAGE_NAME }}-worker",
                "tag": "${GITHUB_SHA}",
                "digest": "${WORKER_DIGEST}"
              }
            }
          }
          EOF

          echo "Generated artifact manifest:"
          cat artifact/artifact-manifest.json

      - name: Validate artifact manifest
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const manifestPath = "artifact/artifact-manifest.json";
          const schemaPath = "ci/artifact-manifest.schema.json";

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, "utf8")
          );

          /*
           * Load the schema as an additional sanity check.
           *
           * Full JSON Schema engine validation is intentionally not
           * introduced here yet because that would add a new runtime
           * dependency to the CI environment.
           */
          JSON.parse(fs.readFileSync(schemaPath, "utf8"));

          const shaPattern = /^[0-9a-f]{40}$/;
          const digestPattern = /^sha256:[0-9a-f]{64}$/;

          function fail(message) {
            console.error(
              `Manifest validation failed: ${message}`
            );
            process.exit(1);
          }

          if (manifest.schemaVersion !== "1.0") {
            fail("invalid schemaVersion");
          }

          if (manifest.project !== "mini-write") {
            fail("invalid project");
          }

          if (!shaPattern.test(manifest.source?.commit || "")) {
            fail("invalid source.commit");
          }

          if (manifest.release?.id !== manifest.source.commit) {
            fail("release.id must equal source.commit");
          }

          if (!manifest.release?.version) {
            fail("release.version is required");
          }

          for (const service of ["api", "worker"]) {
            const artifact = manifest.artifacts?.[service];

            if (!artifact) {
              fail(`missing artifact: ${service}`);
            }

            if (!artifact.name) {
              fail(`${service}.name is required`);
            }

            if (!shaPattern.test(artifact.tag || "")) {
              fail(
                `${service}.tag must be a 40-character SHA`
              );
            }

            if (!digestPattern.test(artifact.digest || "")) {
              fail(
                `${service}.digest must be a sha256 digest`
              );
            }

            if (artifact.tag !== manifest.source.commit) {
              fail(
                `${service}.tag does not match source commit`
              );
            }
          }

          if (manifest.source.commit !== process.env.GITHUB_SHA) {
            fail(
              "source.commit does not match GITHUB_SHA"
            );
          }

          if (
            manifest.artifacts.api.digest !==
            process.env.API_DIGEST
          ) {
            fail(
              "API digest does not match build output"
            );
          }

          if (
            manifest.artifacts.worker.digest !==
            process.env.WORKER_DIGEST
          ) {
            fail(
              "Worker digest does not match build output"
            );
          }

          console.log(
            "Artifact manifest validation passed."
          );

          console.log(
            JSON.stringify(manifest, null, 2)
          );
          NODE

      - name: Upload artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: mini-write-artifact-${{ github.sha }}
          path: artifact/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30