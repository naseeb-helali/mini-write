name: Runner Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-runner:
    runs-on:
      - self-hosted
      - linux
      - x64
      - staging
      - mini-write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner context
        run: |
          echo "Runner validation started"
          whoami
          hostname
          pwd

      - name: Validate Docker access
        run: |
          docker --version
          docker compose version
          docker ps

      - name: Validate deploy runtime
        run: |
          ls -la /opt/deploy
          ls -la /opt/deploy/logs
          ls -la /opt/deploy/state
          ls -la /opt/deploy/env

      - name: Validate write access
        run: |
          echo "runner validation $(date)" >> /opt/deploy/logs/deploy.log
          tail -n 5 /opt/deploy/logs/deploy.log

      - name: Success confirmation
        run: |
          echo "Runner validation completed successfully"
